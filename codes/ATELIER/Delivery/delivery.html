<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATELIER — Shopping Bag & Checkout</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar border-bottom border-secondary-subtle bg-white min-vh-0 py-3">
  <div class="container-fluid px-3 px-sm-4 px-lg-5 position-relative">
    <div class="d-flex align-items-center flex-grow-1">
      <a href="../Cart/cart.html" class="btn-return font-serif text-decoration-none text-secondary d-inline-flex align-items-center gap-1">
        <span class="material-symbols-outlined fs-5 align-middle">chevron_left</span> RETURN
      </a>
    </div>

    <div class="position-absolute start-50 translate-middle-x text-center">
      <a href="#" class="navbar-brand font-serif m-0 text-dark fw-normal">ATELIER</a>
    </div>

    <div class="d-flex align-items-center justify-content-end gap-3 flex-grow-1">
      <button class="btn icon-btn p-1 border-0 bg-transparent text-dark" aria-label="Search">
        <span class="material-symbols-outlined fs-5 align-middle">search</span>
      </button>
      <button class="btn icon-btn p-1 border-0 bg-transparent text-dark d-none d-lg-inline-block" aria-label="Wishlist">
        <span class="material-symbols-outlined fs-5 align-middle">favorite</span>
      </button>
      <button class="btn icon-btn p-1 border-0 bg-transparent text-dark" aria-label="Shopping bag">
        <span class="material-symbols-outlined fs-5 align-middle">shopping_bag</span>
      </button>
      <button class="btn icon-btn p-1 border-0 bg-transparent text-dark d-none d-lg-inline-block" aria-label="Account">
        <span class="material-symbols-outlined fs-5 align-middle">person</span>
      </button>
    </div>
  </div>
</nav>

<main class="flex-grow-1 py-4 py-lg-5">
  <div class="container px-3 px-md-4 px-lg-5">
    <div class="row g-4 g-lg-5">
      <div class="col-12 col-lg-7 col-xl-8">
        <section class="mb-5">
          <h2 class="font-serif fs-4 fw-normal text-dark mb-4"><span class="text-secondary-subtle me-2">01</span> Delivery Address</h2>
          <form id="delivery-form" novalidate>
            <div class="mb-3">
              <label class="font-serif fw-bold text-secondary mb-1 d-block">EMAIL ADDRESS</label>
              <input type="email" id="email" class="form-control rounded-0 shadow-none bg-body-tertiary border border-secondary-subtle p-2 font-sans text-dark" placeholder="Email ID">
              <div id="email-error" class="text-danger font-sans small mt-1"></div>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-6">
                <label class="font-serif fw-bold text-secondary mb-1 d-block">FIRST NAME</label>
                <input type="text" id="firstName" class="form-control rounded-0 shadow-none bg-body-tertiary border border-secondary-subtle p-2 font-sans text-dark" placeholder="First Name">
                <div id="firstName-error" class="text-danger font-sans small mt-1"></div>
              </div>
              <div class="col-6">
                <label class="font-serif fw-bold text-secondary mb-1 d-block">LAST NAME</label>
                <input type="text" id="lastName" class="form-control rounded-0 shadow-none bg-body-tertiary border border-secondary-subtle p-2 font-sans text-dark" placeholder="Last Name">
                <div id="lastName-error" class="text-danger font-sans small mt-1"></div>
              </div>
            </div>
            <div class="mb-3">
              <label class="font-serif fw-bold text-secondary mb-1 d-block">STREET ADDRESS</label>
              <input type="text" id="street" class="form-control rounded-0 shadow-none bg-body-tertiary border border-secondary-subtle p-2 font-sans text-dark" placeholder="Apt, Suite, Street">
              <div id="street-error" class="text-danger font-sans small mt-1"></div>
            </div>
            <div class="row g-3 mb-4">
              <div class="col-6">
                <label class="font-serif fw-bold text-secondary mb-1 d-block">CITY</label>
                <input type="text" id="city" class="form-control rounded-0 shadow-none bg-body-tertiary border border-secondary-subtle p-2 font-sans text-dark" placeholder="City">
                <div id="city-error" class="text-danger font-sans small mt-1"></div>
              </div>
              <div class="col-6">
                <label class="font-serif fw-bold text-secondary mb-1 d-block">POSTAL CODE</label>
                <input type="text" id="postal" class="form-control rounded-0 shadow-none bg-body-tertiary border border-secondary-subtle p-2 font-sans text-dark" placeholder="ZIP / Postal">
                <div id="postal-error" class="text-danger font-sans small mt-1"></div>
              </div>
            </div>
            <div id="final"></div>
            <button type="submit" class="btn btn-dark font-serif rounded-0 border-0 w-100 py-3 text-white mt-3">CONTINUE TO PAYMENT</button>
          </form>
        </section>

        <section class="mb-5">
          <h2 class="font-serif fs-4 fw-normal text-secondary-subtle mb-3"><span class="me-2">02</span> Payment Method</h2>
          <div class="bg-body-tertiary border border-secondary-subtle p-3 d-flex justify-content-between align-items-center text-secondary-subtle font-sans">
            <span>Credit Card</span>
            <span class="material-symbols-outlined fs-5 align-middle">credit_card</span>
          </div>
        </section>

        <section>
          <h2 class="font-serif fs-4 fw-normal text-secondary-subtle"><span class="me-2">03</span> Order Review</h2>
        </section>
      </div>

      <div class="col-12 col-lg-5 col-xl-4">
        <aside class="order-summary-box bg-body-tertiary border border-secondary-subtle p-4 rounded-0 sticky-lg-top">
          <h3 class="font-serif fs-5 fw-normal text-dark mb-4">Order Summary</h3>
          <div class="mb-4" id="summary-items"></div>

          <div class="mb-4">
            <label class="font-serif fw-bold text-secondary mb-1 d-block">DISCOUNT CODE</label>
            <div class="d-flex gap-2 mb-2">
              <input type="text" id="discount" class="form-control rounded-0 shadow-none bg-white border border-secondary-subtle p-2 font-sans text-dark" placeholder="Enter code">
              <button type="button" id="apply-discount" class="btn btn-outline-dark font-serif rounded-0 border-dark px-3 text-dark">APPLY</button>
            </div>
          </div>

          <div class="border-top border-secondary-subtle pt-3">
            <div class="d-flex justify-content-between mb-2">
              <span class="font-sans text-secondary">Subtotal</span>
              <span class="font-sans text-secondary" id="subtotal">$0.00</span>
            </div>
            <div class="d-flex justify-content-between mb-2">
              <span class="font-sans text-secondary">Discount</span>
              <span class="font-sans text-secondary" id="discount-amount">$0.00</span>
            </div>
            <div class="d-flex justify-content-between mb-2">
              <span class="font-sans text-secondary">Shipping</span>
              <span class="font-sans text-secondary" id="shipping">Calculated at next step</span>
            </div>
            <div class="d-flex justify-content-between border-top border-secondary-subtle pt-3 align-items-center">
              <span class="font-serif text-dark fs-6">Total</span>
              <span class="font-sans fs-5 fw-semibold text-dark" id="total">$0.00</span>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </div>
</main>

<footer class="bg-white border-top border-secondary-subtle py-5 mt-auto">
  <div class="container px-3 px-md-4 px-lg-5">
    <div class="row gy-4 align-items-center">
        <div class=" mt-4 pt-3 text-center text-md-start">
            <p class="font-sans text-muted mb-0 footer-copyright">© 2026 ATELIER. DEFINING QUIET LUXURY.</p>
        </div>
        <div class="col-12 col-md-6">
        
            <nav class="d-flex justify-content-center justify-content-md-end align-items-center flex-wrap gap-4">
            <a href="#" class="footer-link font-serif text-decoration-none text-secondary">Privacy</a>
            <a href="#" class="footer-link font-serif text-decoration-none text-secondary">Terms</a>
            <a href="#" class="footer-link font-serif text-decoration-none text-secondary">Contact</a>

            </nav>
        </div>
    </div>
    
  </div>
</footer>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
