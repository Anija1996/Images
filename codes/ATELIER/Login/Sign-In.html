<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
    <div class="login-container border bg-white p-80">
        <div class="d-flex flex-column gap-4">
            <div class="section-1 text-center d-flex flex-column gap-2">
                <h1 class="fw-normal">ATELIER</h1>
                <span class="fs-6 fw-normal">Sign in to your account</span>
            </div>
            <div class="section-2 row align-items-center justify-content-center fw-semibold">
                <div class="col-6 bb-2 text-center text-nowrap pb-2">
                    <a class="text-dark text-decoration-none" href="Sign-In.html">SIGN IN</a>
                </div>
                <div class="col-6 text-center text-nowrap pb-2">
                    <a class="text-secondary text-decoration-none" href="create/create.html">CREATE ACCOUNT</a>
                </div>
            </div>
        </div>
        <form id="signin-form">
            <div class="d-flex flex-column gap-3 mt-4">
                <label for="email" class="label fw-semibold">EMAIL ADDRESS</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" class="border-0 border-bottom">
                <p id="email-error" class="m-0 p-0"></p>
                <label for="password" class="label fw-semibold">PASSWORD</label>
                <input type="password" id="password" name="password" placeholder="......" class="border-0 border-bottom">
                <p id="password-error" class="m-0 p-0"></p>
            </div>
            <div class="d-flex flex-column w-100">
                <div class="d-flex justify-content-between pt-2 pb-3 w-100">
                    <div class="form-check">
                        <input class="form-check-input fw-normal" type="checkbox" id="rememberme">
                        <label class="form-check-label" for="rememberme">Remember me</label>
                    </div>
                    <a href="#" class="link text-decoration-none">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-dark fw-semibold rounded-0 px-3 py-2 w-100">SIGN IN</button>
                <p id="message"></p>
            </div>
        </form>
        <div class="section-3 d-flex flex-column w-100">
            <div class="d-flex align-items-center gap-3 my-3">
                <hr class="flex-grow-1">
                <span class="fw-semibold">OR CONTINUE WITH</span>
                <hr class="flex-grow-1">
            </div>
            <button type="button" class="btn bg-transparent border fw-semibold rounded-0 py-2 px-3 w-100 d-flex align-items-center justify-content-center gap-2">
                <img src="images/google.png" class="google-icon" alt="Google">
                GOOGLE
            </button>
        </div>
    </div>
    <a id="home-link" href="../Homepage/index.html" class="d-none">Home</a>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9H9J09JcYn3nv7wiPVlz7YYjWrVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
